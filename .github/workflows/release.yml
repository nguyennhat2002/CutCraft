name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: cargo build --release --package capcut-editor
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: capcut-editor-${{ matrix.os }}
          path: |
            target/release/capcut-editor
            target/release/capcut-editor.exe