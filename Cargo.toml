[workspace]
members = ["apps/capcut-editor", "crates/core", "crates/capcut-format", "crates/engine", "crates/media", "crates/renderer", "crates/ui", "xtask"]
default-members = ["apps/capcut-editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
egui = "0.37.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
egui-lucide = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
capcut-core = { path = "crates/core" }
capcut-format = { path = "crates/capcut-format" }
capcut-engine = { path = "crates/engine" }
capcut-media = { path = "crates/media" }
capcut-renderer = { path = "crates/renderer" }
capcut-ui = { path = "crates/ui" }